<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SPM Planner</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

<h1>SPM Planner</h1>

<div id="home">
  <button onclick="showPage('scholarships')">SCHOLARSHIPS</button>
  <button onclick="showPage('upu')">UPU</button>
  <button onclick="showPage('results')">UPDATE RESULT</button>
</div>

<!-- SCHOLARSHIPS -->
<div id="scholarships" class="page hidden">
  <h2>Scholarships</h2>
  <button onclick="openScholarshipForm()">➕ Add Scholarship</button>
  <div id="scholarshipList"></div>
</div>

<!-- UPU -->
<div id="upu" class="page hidden">
  <h2>UPU</h2>
  <button onclick="openUPUForm()">➕ Add Course</button>
  <div id="upuList"></div>
</div>

<!-- RESULTS -->
<div id="results" class="page hidden">
  <h2>Update Results</h2>

  <div id="subjects"></div>

  <label>Cocurriculum Points:</label>
  <input type="number" id="coco"><br>

  <label>Merit Points:</label>
  <input type="number" id="merit"><br><br>

  <button onclick="saveResults()">Save Results</button>
</div>

<!-- MODAL -->
<div id="formModal" class="hidden"></div>

</body>
</html>
